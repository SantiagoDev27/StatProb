<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Fondo principal -->
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    
    <!-- Gradiente translúcido para el histograma -->
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9333EA" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.05" />
    </linearGradient>
    
    <!-- Gradiente neón para la Campana de Gauss -->
    <linearGradient id="curve" x1="80" y1="140" x2="432" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9333EA" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>
    
    <!-- Efecto de resplandor (Glow) -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Contenedor Base -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect width="510" height="510" x="1" y="1" rx="111" stroke="#1E293B" stroke-width="2" />

  <!-- Histograma (Barras) -->
  <rect x="116" y="320" width="40" height="96" rx="6" fill="url(#bar)" />
  <rect x="176" y="240" width="40" height="176" rx="6" fill="url(#bar)" />
  <rect x="236" y="140" width="40" height="276" rx="6" fill="url(#bar)" />
  <rect x="296" y="240" width="40" height="176" rx="6" fill="url(#bar)" />
  <rect x="356" y="320" width="40" height="96" rx="6" fill="url(#bar)" />

  <!-- Líneas Punteadas (Desviación Estándar y Media) -->
  <path d="M 256 140 L 256 416" stroke="#06B6D4" stroke-width="4" stroke-dasharray="12 8" opacity="0.6" />
  <path d="M 196 240 L 196 416" stroke="#9333EA" stroke-width="4" stroke-dasharray="8 8" opacity="0.4" />
  <path d="M 316 240 L 316 416" stroke="#9333EA" stroke-width="4" stroke-dasharray="8 8" opacity="0.4" />

  <!-- Línea Base (Eje X) -->
  <path d="M 80 416 L 432 416" stroke="#334155" stroke-width="8" stroke-linecap="round" />

  <!-- Campana de Gauss (Distribución Normal) -->
  <path d="M 80 400 C 160 400, 190 140, 256 140 C 322 140, 352 400, 432 400" stroke="url(#curve)" stroke-width="20" stroke-linecap="round" fill="none" filter="url(#glow)" />

  <!-- Nodo Central (Medida de Tendencia Central) -->
  <circle cx="256" cy="140" r="14" fill="#0F172A" stroke="#06B6D4" stroke-width="6" />
</svg>